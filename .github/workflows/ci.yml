name: FitMitra CI & Release Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-gate:
    name: PostgreSQL Live Validation, Recovery & Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fitmitra_ci
          POSTGRES_PASSWORD: fitmitra_ci_disposable_password
          POSTGRES_DB: fitmitra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies (clean install from lockfile)
        run: npm ci

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Verify PostgreSQL readiness
        run: |
          echo "Verifying PostgreSQL connectivity on localhost:5432..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U fitmitra_ci; then
              echo "✓ PostgreSQL service is responsive."
              break
            fi
            echo "Waiting for PostgreSQL container ($i/30)..."
            sleep 1
          done
        env:
          PGPASSWORD: fitmitra_ci_disposable_password

      - name: Print Node.js & npm runtime diagnostics
        run: |
          echo "Node.js runtime version: $(node --version)"
          echo "npm runtime version: $(npm --version)"

      - name: Run Strict Release Gate (Live PostgreSQL Multi-Process Tests)
        env:
          TEST_DATABASE_URL: "postgres://fitmitra_ci:fitmitra_ci_disposable_password@localhost:5432/fitmitra_test"
          NODE_ENV: test
        run: npm run test:release-gate

      - name: Run Disaster Recovery Drill (pg_dump & pg_restore)
        env:
          TEST_DATABASE_URL: "postgres://fitmitra_ci:fitmitra_ci_disposable_password@localhost:5432/fitmitra_test"
          NODE_ENV: test
        run: npm run drill:backup-restore -- --strict

      - name: Run Full Unit & Component Test Suite
        env:
          NODE_ENV: test
        run: npm test

      - name: Run TypeScript Strict Type Verification
        run: npx tsc --noEmit

      - name: Run Web Client Production Build
        run: npm run build

      - name: Verify GitHub Pages Compatibility (.nojekyll)
        run: |
          touch out/.nojekyll
          test -f out/.nojekyll

      - name: Upload Diagnostic Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-diagnostics
          path: |
            *.log
            out/
          retention-days: 7
